name: deploy-miniapp

on:
  workflow_dispatch:
    inputs:
      environment:
        required: true
        description: Deploy to DEV/PROD
        type: choice
        options: [DEV, PROD]

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yaml
    permissions:
      packages: write
      contents: read
      attestations: write
      id-token: write
    secrets: inherit
    with:
      dockerfile_path: 'miniapp'
      context_path: 'miniapp'
      image_name: 'dishdash-miniapp'
      environment: ${{ github.event.inputs.environment }}
      secret-service-hash: ${{ github.event.inputs.environment == 'PROD' && 'MINIAPP_SERVICE_HASH' || 'MINIAPP_SERVICE_HASH_DEV' }}
      push_to_ghcr: true
